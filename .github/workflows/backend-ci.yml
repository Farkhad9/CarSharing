name: Backend CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore
        run: dotnet restore backend/CarSharing.WebApi/CarSharing.WebApi.csproj

      - name: Build
        run: dotnet build backend/CarSharing.WebApi/CarSharing.WebApi.csproj --configuration Release --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      - name: Validate EF Core migrations
        run: >
          dotnet ef migrations script --idempotent
          --project backend/CarSharing.Infrastructure/CarSharing.Infrastructure.csproj
          --startup-project backend/CarSharing.WebApi/CarSharing.WebApi.csproj
          --configuration Release
          --no-build
          --output backend/migrations-check.sql
