name: Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore
        run: dotnet restore backend/CarSharing.WebApi/CarSharing.WebApi.csproj

      - name: Build
        run: dotnet build backend/CarSharing.WebApi/CarSharing.WebApi.csproj --configuration Release --no-restore
