name: Full CI

on:
  workflow_dispatch:

  push:
    branches:
      - "**"

  pull_request:

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build, tests, and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore backend
        run: dotnet restore backend/CarSharing.WebApi/CarSharing.WebApi.csproj

      - name: Restore tests
        run: dotnet restore backend/CarSharing.Application.Tests/CarSharing.Application.Tests.csproj

      - name: Build backend
        run: dotnet build backend/CarSharing.WebApi/CarSharing.WebApi.csproj --configuration Release --no-restore

      - name: Build backend tests
        run: dotnet build backend/CarSharing.Application.Tests/CarSharing.Application.Tests.csproj --configuration Release --no-restore

      - name: Run application tests
        run: dotnet test backend/CarSharing.Application.Tests/CarSharing.Application.Tests.csproj --configuration Release --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      - name: Validate EF Core migrations
        run: >
          dotnet ef migrations script --idempotent
          --project backend/CarSharing.Infrastructure/CarSharing.Infrastructure.csproj
          --startup-project backend/CarSharing.WebApi/CarSharing.WebApi.csproj
          --configuration Release
          --no-build
          --output backend/migrations-check.sql

      - name: Publish backend artifact
        run: >
          dotnet publish backend/CarSharing.WebApi/CarSharing.WebApi.csproj
          --configuration Release
          --no-build
          --output backend/publish

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsharing-backend
          path: backend/publish

      - name: Upload migrations script
        uses: actions/upload-artifact@v4
        with:
          name: carsharing-migrations
          path: backend/migrations-check.sql

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: my-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: my-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsharing-frontend
          path: my-project/dist
