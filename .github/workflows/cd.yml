name: CD Release Package

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-package:
    name: Build deployable release package
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: my-project/package-lock.json

      - name: Restore backend
        run: dotnet restore backend/CarSharing.WebApi/CarSharing.WebApi.csproj

      - name: Build backend
        run: dotnet build backend/CarSharing.WebApi/CarSharing.WebApi.csproj --configuration Release --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      - name: Generate migration script
        run: >
          dotnet ef migrations script --idempotent
          --project backend/CarSharing.Infrastructure/CarSharing.Infrastructure.csproj
          --startup-project backend/CarSharing.WebApi/CarSharing.WebApi.csproj
          --configuration Release
          --no-build
          --output release/migrations.sql

      - name: Publish backend
        run: >
          dotnet publish backend/CarSharing.WebApi/CarSharing.WebApi.csproj
          --configuration Release
          --no-build
          --output release/backend

      - name: Install frontend dependencies
        working-directory: my-project
        run: npm ci

      - name: Build frontend
        working-directory: my-project
        run: npm run build

      - name: Copy frontend build
        run: |
          mkdir -p release/frontend
          cp -R my-project/dist/. release/frontend/

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: carsharing-release-package
          path: release
